# Architecture boundary gate.
#
# Deliberately standalone and secret-free: it does not call the shared
# orchestrator, so it runs and gives a verdict even before deployment
# credentials exist.
#
# There is no known-violations baseline any more. There was one, holding a
# cycle through the hierarchy page shell and app-nav's reach into the
# notifications repository; both are fixed, so every check below is strict
# and whole-tree. Do not reintroduce a baseline to land a violation — fix
# the edge.
name: Boundaries

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: boundaries-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  boundaries:
    name: Boundaries and tokens
    runs-on: ubuntu-latest
    steps:
      # Full history: the feature-architecture step diffs against a base ref,
      # and the default shallow clone has nothing to diff against.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Import graph (barrels, cycles, shared purity)
        run: npm run boundaries

      - name: Stylesheet token discipline
        run: npm run lint:css

      # Layer rules from the next-feature-architecture skill: thin routes,
      # no I/O in views, no React in model/.
      #
      # The checker is vendored into scripts/ rather than cloned. The upstream
      # skill repository is private, so an unauthenticated clone could never
      # succeed here — and this job is deliberately secret-free, so there is no
      # token to authenticate with. Vendoring keeps the gate hermetic.
      # Re-sync with: node scripts/check-boundaries.mjs --help
      #
      # Whole tree, not touched paths. This used to diff against a base ref
      # because the unmigrated routes carried ~50 thin-page violations that
      # would drown the signal. Every vertical is migrated now and the count is
      # zero, so scanning everything is strictly better: it catches a
      # regression anywhere, not only in the files a PR happens to touch.
      - name: Feature architecture
        run: npm run arch:check

      - name: Capability package provenance
        run: npm run check:capability-package

      - name: Capability surface
        run: npm run check:capabilities

      - name: Build-profile conformance
        run: npm run check:profiles

      - name: Hosted profile artifact build
        run: node scripts/build-profile.cjs --profile hosted

      - name: Enterprise profile artifact build
        run: node scripts/build-profile.cjs --profile enterprise

      - name: Documentation and generated maps
        run: npm run check:documentation

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npx eslint src --max-warnings=0

      - name: Cyclomatic complexity
        run: npm run complexity

      # The whole Jest suite (no path filter), with coverage: jest.config.js
      # sets collectCoverage and a global coverageThreshold, so a coverage drop
      # below the floor fails this step as surely as a failing test. --ci makes
      # a missing snapshot a failure instead of writing it (Actions sets CI=true,
      # which implies the same; the flag keeps it true however the job is run).
      # Browser E2E (npm run test:e2e) stays local: this job installs no browser.
      - name: Unit tests
        run: npm test -- --ci
