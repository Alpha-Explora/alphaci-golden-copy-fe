# Architecture boundary gate.
#
# Deliberately standalone and secret-free: it does not call the shared
# orchestrator, so it runs and gives a verdict even before deployment
# credentials exist.
#
# The baseline in .dependency-cruiser-known-violations.json records the violations
# present when the structure was introduced. This job fails only on
# violations *beyond* that baseline, so the count can go down and never up.
# When you fix some, regenerate with:
#   npx depcruise src --config .dependency-cruiser.cjs \
#     --output-type baseline > .dependency-cruiser-known-violations.json
name: Boundaries

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: boundaries-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  boundaries:
    name: Boundaries and tokens
    runs-on: ubuntu-latest
    steps:
      # Full history: the feature-architecture step diffs against a base ref,
      # and the default shallow clone has nothing to diff against.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: No new boundary violations
        run: npm run boundaries

      - name: Stylesheet token discipline
        run: npm run lint:css

      # Layer rules from the next-feature-architecture skill: thin routes,
      # no I/O in views, no React in model/.
      #
      # The checker is vendored into scripts/ rather than cloned. The upstream
      # skill repository is private, so an unauthenticated clone could never
      # succeed here — and this job is deliberately secret-free, so there is no
      # token to authenticate with. Vendoring keeps the gate hermetic.
      # Re-sync with: node scripts/check-boundaries.mjs --help
      #
      # Touched paths only, never the whole tree: the unmigrated routes carry
      # 50 known thin-page violations that would drown the signal. On a pull
      # request the diff base is the target branch; on a push it is the commit
      # before the push.
      - name: Feature architecture (touched paths)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SINCE="origin/${{ github.base_ref }}"
          else
            SINCE="${{ github.event.before }}"
          fi
          # A first push to a new branch reports an all-zero "before" SHA.
          case "$SINCE" in
            ""|0000000000000000000000000000000000000000) SINCE="HEAD~1" ;;
          esac
          echo "Comparing against $SINCE"
          node scripts/check-boundaries.mjs --cwd . --src auto --since "$SINCE"

      - name: Report remaining baseline debt
        if: always()
        run: |
          COUNT=$(node -p "require('./.dependency-cruiser-known-violations.json').length")
          echo "### Boundary debt: $COUNT known violations remaining" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Each one is a module reaching into another module's internals." >> "$GITHUB_STEP_SUMMARY"
          echo "They are migrated away feature by feature — see src/features/README.md." >> "$GITHUB_STEP_SUMMARY"
